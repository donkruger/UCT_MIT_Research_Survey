# =============================================================================
# TRADING SHEET APPLET - SECRETS TEMPLATE
# =============================================================================
# This file is committed to the repository with placeholders.
# At runtime, entrypoint.sh replaces ${VAR} with environment variables.
# ALL environment variables must be set in ECS Task Definition.
# =============================================================================

# -----------------------------------------------------------------------------
# EMAIL CONFIGURATION - Audit Trail & Notifications
# -----------------------------------------------------------------------------
[email_credentials]
email_address = "${EMAIL_ADDRESS}"
app_password = "${EMAIL_APP_PASSWORD}"
notification_address = "${EMAIL_NOTIFICATION_ADDRESS}"
recipient_address = "${EMAIL_RECIPIENT_ADDRESS}"  # Backward compatibility
smtp_server = "${EMAIL_SMTP_SERVER}"

# -----------------------------------------------------------------------------
# LLM API - AI Features (Optional)
# -----------------------------------------------------------------------------
[llm_api]
gemini_key = "${LLM_GEMINI_API_KEY}"

# -----------------------------------------------------------------------------
# TRADE ALLOCATIONS API - Core Trading Functionality
# -----------------------------------------------------------------------------
[trade_api]
# Environment selection: "uat", "qa", or "prod"
environment = "${TRADE_API_ENVIRONMENT}"

# UAT Environment URLs
uat_base_url = "${TRADE_API_UAT_BASE_URL}"
uat_monitor_url = "${TRADE_API_UAT_MONITOR_URL}"

# QA Environment URLs
qa_base_url = "${TRADE_API_QA_BASE_URL}"
qa_monitor_url = "${TRADE_API_QA_MONITOR_URL}"

# Production Environment URLs
prod_base_url = "${TRADE_API_PROD_BASE_URL}"
prod_monitor_url = "${TRADE_API_PROD_MONITOR_URL}"

# System Configuration
system_identifier_id = ${TRADE_API_SYSTEM_ID}
api_timeout = ${TRADE_API_TIMEOUT}
max_retry_attempts = ${TRADE_API_MAX_RETRIES}
status_polling_interval = ${TRADE_API_POLLING_INTERVAL}
max_polling_duration = ${TRADE_API_MAX_POLLING_DURATION}

# Authentication (Bearer token for API)
api_key = "${TRADE_API_KEY}"

# Optional: Trader configuration
default_trader_id = ${TRADE_API_DEFAULT_TRADER_ID}

# -----------------------------------------------------------------------------
# TRADE PROTECTION - UT-Only Security Enforcement
# -----------------------------------------------------------------------------
[trade_protection]
# SECURITY: Fail-safe default - protection always enabled unless explicitly disabled
block_non_ut_trades = ${TRADE_PROTECTION_BLOCK_NON_UT}
supported_contract_prefixes = ["${TRADE_PROTECTION_PREFIX_1}"]
protection_mode = "${TRADE_PROTECTION_MODE}"
audit_all_validations = ${TRADE_PROTECTION_AUDIT_ALL}

# SECURITY: Environment-specific overrides (UAT/QA only)
allow_protection_override = ${TRADE_PROTECTION_ALLOW_OVERRIDE}
max_validation_attempts = ${TRADE_PROTECTION_MAX_ATTEMPTS}

# -----------------------------------------------------------------------------
# AUTHENTICATION CONFIGURATION
# -----------------------------------------------------------------------------
[auth]
# Authentication provider selection (swap without code changes)
provider = "${AUTH_PROVIDER}"

# Session configuration
session_timeout_minutes = ${AUTH_SESSION_TIMEOUT}
session_inactivity_timeout_minutes = ${AUTH_INACTIVITY_TIMEOUT}

# Rate limiting (brute force protection)
max_login_attempts = ${AUTH_MAX_LOGIN_ATTEMPTS}
lockout_duration_minutes = ${AUTH_LOCKOUT_DURATION}

# Audit configuration
log_login_attempts = ${AUTH_LOG_ATTEMPTS}
log_failed_attempts_only = ${AUTH_LOG_FAILED_ONLY}

# -----------------------------------------------------------------------------
# USER MANAGEMENT (MVP - secrets provider)
# -----------------------------------------------------------------------------
# CRITICAL: Use bcrypt hashes, NOT plain text
# Note: User hashes are loaded from separate environment variables
# Pattern: USERS_ADMIN_<IDENTIFIER> = "email|name|password_hash|role|enabled"
# Example: USERS_ADMIN_DON_EE = "don@easyequities.co.za|Don Kruger|$2b$12$...|admin|true"
# This section is populated dynamically at runtime by entrypoint.sh
# -----------------------------------------------------------------------------
[users.admin]
# Users will be constructed by entrypoint.sh from USERS_ADMIN_* environment variables
# This section is populated dynamically at runtime
