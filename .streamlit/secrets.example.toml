# =============================================================================
# TRADING SHEET APPLET - SECRETS EXAMPLE (FOR REFERENCE ONLY)
# =============================================================================
# This is an example of what your secrets.toml should look like.
# Copy this to .streamlit/secrets.toml and fill in your actual values.
# 
# IMPORTANT: Never commit .streamlit/secrets.toml to the repository!
# For production deployments, use the DevOps-friendly secrets system instead.
# =============================================================================

# -----------------------------------------------------------------------------
# EMAIL CONFIGURATION - Audit Trail & Notifications
# -----------------------------------------------------------------------------
[email_credentials]
email_address = "your-email@gmail.com"
app_password = "your-app-password"
notification_address = "don.kruger123@gmail.com"  # Where audit emails are sent
recipient_address = "don.kruger123@gmail.com"  # Backward compatibility - same as notification_address
smtp_server = "smtp.gmail.com"

# -----------------------------------------------------------------------------
# LLM API - AI Features (Optional)
# -----------------------------------------------------------------------------
[llm_api]
gemini_key = "your-gemini-api-key-here"

# -----------------------------------------------------------------------------
# TRADE ALLOCATIONS API - Core Trading Functionality
# -----------------------------------------------------------------------------
[trade_api]
# Environment selection: "uat", "qa", or "prod"
environment = "uat"

# UAT Environment URLs (verified working)
uat_base_url = "https://tradeallocationsapi.purple-uat.easyequities.io"
uat_monitor_url = "https://trade-allocations-monitor.purple-uat.easyequities.io"

# QA Environment URLs (verified working)
qa_base_url = "https://tradeallocationsapi.purple-qa.easyequities.io"
qa_monitor_url = "https://trade-allocations-monitor.purple-qa.easyequities.io"

# Production Environment URLs (update when available)
prod_base_url = "https://tradeallocationsapi.easyequities.io"
prod_monitor_url = "https://trade-allocations-monitor.easyequities.io"

# System Configuration (verified settings)
system_identifier_id = 27  # Your application's system ID
api_timeout = 30  # API request timeout in seconds
max_retry_attempts = 3  # Maximum retry attempts for failed requests
status_polling_interval = 5  # Seconds between status checks
max_polling_duration = 300  # Maximum time to poll for status (5 minutes)

# Authentication (Bearer token for API - REPLACE WITH ACTUAL TOKEN)
api_key = "your-api-key-here"

# Optional: Trader configuration
default_trader_id = 45314  # Default trader ID for submissions

# -----------------------------------------------------------------------------
# TRADE PROTECTION - UT-Only Security Enforcement
# -----------------------------------------------------------------------------
[trade_protection]
# SECURITY: Fail-safe default - protection always enabled unless explicitly disabled
block_non_ut_trades = true
supported_contract_prefixes = ["UT.ZA"]
protection_mode = "strict"  # Options: "strict" or "audit_warn"
audit_all_validations = true

# SECURITY: Environment-specific overrides (UAT/QA only)
allow_protection_override = false  # PRODUCTION: Must be false
max_validation_attempts = 3

# -----------------------------------------------------------------------------
# AUTHENTICATION CONFIGURATION
# -----------------------------------------------------------------------------
[auth]
# Authentication provider selection (swap without code changes)
provider = "secrets"  # Options: "secrets" (MVP), "oauth", "ldap", "database"

# Session configuration
session_timeout_minutes = 60
session_inactivity_timeout_minutes = 30

# Rate limiting (brute force protection)
max_login_attempts = 5
lockout_duration_minutes = 15

# Audit configuration
log_login_attempts = true
log_failed_attempts_only = false

# -----------------------------------------------------------------------------
# USER MANAGEMENT (MVP - secrets provider)
# -----------------------------------------------------------------------------
# CRITICAL: Use bcrypt hashes, NOT plain text
# Generate hash: python3 -c "import bcrypt; print(bcrypt.hashpw(b'YourPassword', bcrypt.gensalt()).decode())"
# -----------------------------------------------------------------------------
[users.admin]
"user@example.com" = {name = "User Name", password_hash = "$2b$12$EXAMPLE_HASH_REPLACE_WITH_ACTUAL_HASH", role = "admin", enabled = true}
# Add more users as needed:
# "another@example.com" = {name = "Another User", password_hash = "$2b$12$...", role = "admin", enabled = true}