# Example email configuration for Gmail App Password
# 
# IMPORTANT: Generate an App Password for Gmail:
# 1. Enable 2FA on your Google Account
# 2. Visit https://myaccount.google.com/apppasswords
# 3. Generate an App Password for "Mail" → "Other (Custom name)"
# 4. Copy the 16-character password (e.g., "abcd efgh ijkl mnop")
# 5. Paste it below (with or without spaces - both work)

[email_credentials]
# Your Gmail address
email_address = "trading@easyequities.co.za"

# The 16-character App Password from Google (NOT your regular Gmail password)
# Example: "abcd efgh ijkl mnop" or "abcdefghijklmnop" (spaces optional)
app_password = "abcd efgh ijkl mnop"

# Where audit emails should be sent (can be same as sender or different)
notification_address = "trading-ops@easyequities.co.za"

# SMTP server (Gmail default)
smtp_server = "smtp.gmail.com"

# Optional: If you want a different recipient for testing
# recipient_address = "test@example.com"
