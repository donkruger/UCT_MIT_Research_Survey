[theme]
# EasyEquities Red Theme Configuration
primaryColor = "#ed1847"           # EasyEquities primary red for buttons, links, and accents
backgroundColor = "#ffffff"        # Clean white background
secondaryBackgroundColor = "#f8f9fa"  # Light gray for containers and sidebars
textColor = "#262730"             # Dark text for readability

# Optional: Custom font
font = "sans serif"               # Options: "sans serif", "serif", "monospace"

[server]
# Development settings
headless = false
enableCORS = false
enableXsrfProtection = true

[browser]
# Automatically open browser on startup
gatherUsageStats = false